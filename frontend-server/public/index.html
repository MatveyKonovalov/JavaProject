<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UniTeam — студенческие проекты</title>
<style>
:root{--blue:#4169e1;--dark:#18233c;--muted:#6e7890;--bg:#f4f6fb;--line:#e5e9f2;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--dark)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:var(--blue);color:white;font-weight:650}button:hover{filter:brightness(.95)}button.secondary{background:#eef1ff;color:#3553b8}button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #dce2ee;border-radius:10px;background:white;color:var(--dark);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4169e122}label{display:block;font-size:13px;font-weight:650;margin:0 0 6px;color:#46516a}.field{margin-bottom:13px}textarea{min-height:90px;resize:vertical}.layout{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:#17213a;color:white;padding:25px 17px;display:flex;flex-direction:column;gap:24px}.brand{font-size:23px;font-weight:850;letter-spacing:-.8px;padding:4px 12px}.brand span{color:#89a1ff}.nav{display:grid;gap:7px}.nav button{background:transparent;color:#bfc8dd;text-align:left;font-weight:550}.nav button.active,.nav button:hover{background:#2b3858;color:white}.sidebar-note{margin-top:auto;color:#9eabc6;font-size:12px;line-height:1.6;padding:12px}.main{min-width:0}.topbar{height:78px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:20px}.topbar small{color:var(--muted)}.content{padding:32px;max-width:1250px;margin:auto}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px}.heading{font-size:30px;letter-spacing:-1px;margin:8px 0}.sub{color:var(--muted);margin:0 0 24px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:0 5px 18px #24345b05}.filters{display:grid;grid-template-columns:minmax(220px,1fr) 220px 170px auto;gap:10px;margin-bottom:18px}.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.project{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}.project h3{font-size:19px;margin:0}.project p{color:#5d6880;line-height:1.55;margin:0;white-space:pre-wrap}.pill{display:inline-flex;align-items:center;background:#edf1ff;color:#3553b8;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:12px;border:1px solid var(--line);padding:5px 8px;border-radius:8px;color:#56617a}.project-foot{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat{padding:18px}.stat strong{font-size:26px;display:block;margin-top:8px}.empty{grid-column:1/-1;text-align:center;padding:45px;color:var(--muted)}.hidden{display:none!important}.notice{padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:14px;white-space:pre-wrap}.notice.error{background:#fff0f0;color:#a72e3b}.notice.success{background:#eaf9f0;color:#176a3a}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}.checkbox-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;max-height:200px;overflow:auto;padding:4px}.check{display:flex;gap:7px;align-items:center;font-size:13px;color:#4b5670}.check input{width:auto}.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:white}.auth-art{background:linear-gradient(145deg,#17213a,#334c9c);color:white;padding:8vw;display:flex;flex-direction:column;justify-content:center}.auth-art h1{font-size:clamp(35px,5vw,62px);letter-spacing:-2px;line-height:1.04;margin:20px 0}.auth-art p{color:#d0d8f2;line-height:1.7;max-width:440px}.auth-box{width:min(430px,calc(100% - 40px));margin:auto;padding:36px 0}.auth-tabs{display:flex;background:#f0f2f8;padding:4px;border-radius:12px;margin-bottom:22px}.auth-tabs button{flex:1;background:transparent;color:#66718b}.auth-tabs button.active{background:white;color:#1b2742;box-shadow:0 2px 8px #18233c10}.small-link{background:none;color:var(--blue);padding:0}.toast{position:fixed;right:22px;bottom:22px;background:#17213a;color:white;padding:13px 18px;border-radius:12px;box-shadow:0 10px 35px #18233c30;max-width:360px;z-index:5}.profile-info{display:grid;grid-template-columns:1fr 1fr;gap:14px}.info-item{padding:13px;background:#f7f8fc;border-radius:10px}.info-item small{color:var(--muted);display:block;margin-bottom:5px}.modal-backdrop{position:fixed;inset:0;background:#10182a77;display:grid;place-items:center;padding:20px;z-index:4}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:24px}.modal h2{margin-top:0}.spinner{display:inline-block;width:15px;height:15px;border:2px solid #ffffff80;border-top-color:white;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{padding:12px 14px;gap:10px}.brand{padding:4px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px 12px}.sidebar-note{display:none}.topbar{height:62px;padding:0 18px}.content{padding:20px 14px}.projects{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters button{grid-column:1/-1}.auth-wrap{grid-template-columns:1fr}.auth-art{display:none}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:21px}.checkbox-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.filters,.form-grid,.profile-info{grid-template-columns:1fr}.full{grid-column:auto}.topbar{padding:0 12px}.topbar .muted{display:none}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{display:none}}

.sm{padding:6px 11px;font-size:13px;border-radius:8px}button.danger{background:#fdecee;color:#b3261e}button:disabled{opacity:.6;cursor:default}.grow{flex:1;min-width:0}.member{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.member:last-child{border-bottom:0}.avatar{width:36px;height:36px;flex:none;background:#e9edff;color:#3553b8;border-radius:50%;display:grid;place-items:center;font-weight:800}.badge{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#f0f2f8;color:#56617a}.badge.CAPTAIN{background:#fff4d6;color:#8a5a00}.badge.SUBCAPTAIN{background:#e6f4ff;color:#0b5c9a}.badge.EMPLOYEE{background:#eaf9f0;color:#176a3a}.project h3.link{cursor:pointer}.project h3.link:hover{color:var(--blue)}summary{outline:none}
</style></head>
<body><div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const API='/api/v0';
const state={access:null,refresh:null,user:null,projects:[],universities:[],skills:[],types:[],view:'projects',filterUniversity:'',filterCourse:'',query:'',authMode:'login',projectId:null,project:null,members:[],candidates:[],cancelled:[]};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3500)}
function saveTokens(a,r){state.access=a;state.refresh=r;localStorage.setItem('unit_access',a||'');localStorage.setItem('unit_refresh',r||'')}
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(state.access)headers.Authorization='Bearer '+state.access;let res;try{res=await fetch(API+path,{...opts,headers})}catch(e){throw new Error('Не удалось связаться с сервером. Убедитесь, что Spring Boot запущен.')};let data;const raw=await res.text();try{data=raw?JSON.parse(raw):null}catch{data=raw};if(!res.ok){let msg=typeof data==='string'?data:(data?.message||data?.error||`Ошибка HTTP ${res.status}`);throw new Error(msg)}return data}
function nameOf(x){return x?.title||x?.name||x?.value||x?.id||''}
const universityEnums=['MSU','SPBU','MIPT','HSE','MSTU_BAUMAN','MEPHI','ITMO','NSU','TSU','KFU','URJU','RUDN','MGIMO','MISIS','MAI','SPBSTU','RSSU','PSU','SFU','SUSU'];
const skillEnums='PYTHON JAVA KOTLIN GROOVY GO RUST C CPP C_SHARP JAVASCRIPT TYPESCRIPT PHP RUBY SWIFT SCALA PERL R MATLAB DART ZIG SPRING_BOOT SPRING_MVC SPRING_DATA_JPA SPRING_SECURITY DJANGO FLASK FASTAPI EXPRESS NEST_JS REACT ANGULAR VUE NEXT_JS GIN ECHO ASP_NET LARAVEL RUBY_ON_RAILS POSTGRESQL MYSQL MONGODB REDIS ELASTICSEARCH CASSANDRA SQLITE ORACLE SQL_SERVER CLICKHOUSE COUCHDB NEO4J DOCKER KUBERNETES JENKINS GIT GITHUB_ACTIONS GITLAB_CI MAVEN GRADLE LINUX BASH TERRAFORM ANSIBLE PROMETHEUS GRAFANA NGINX APACHE RABBITMQ KAFKA ZOOKEEPER SWAGGER AWS AZURE GOOGLE_CLOUD YANDEX_CLOUD LINODE HEROKU NETLIFY VERCEL ANDROID IOS FLUTTER REACT_NATIVE XAMARIN TENSORFLOW PYTORCH SCIKIT_LEARN PANDAS NUMPY JUPYTER OPENCV KERAS JUNIT TESTNG SELENIUM CYPRESS MOCKITO POSTMAN AGILE SCRUM KANBAN DEVOPS MICROSERVICES REST_API GRAPHQL WEB_SOCKETS CQRS EVENT_SOURCING TDD BDD'.split(' ');
function enumName(list,id){return list[Number(id)-1]||''}
const typeTitles={DEVELOPMENT:'Разработка',ANALYTICS:'Аналитика',ML:'Машинное обучение',INFORMATION_SECURITY:'Информационная безопасность'};
async function loadCommon(){try{const [u,s,t]=await Promise.all([api('/info/universities'),api('/info/skills'),api('/info/projectTypes')]);state.universities=u?.elements||[];state.skills=s?.elements||[];state.types=t?.types||[]}catch(e){console.warn('Справочники:',e.message)}}
function authScreen(){return `<div class="auth-wrap"><section class="auth-art"><div class="brand">Uni<span>Team</span></div><h1>Найди свою<br>команду.</h1><p>Объединяйся со студентами, делись навыками и запускай проекты вместе. Хорошие идеи начинаются с хороших людей.</p><div class="tags"><span class="tag">Совместные проекты</span><span class="tag">Студенческое сообщество</span></div></section><section class="auth-box"><div class="eyebrow">СТУДЕНЧЕСКАЯ ПЛАТФОРМА</div><h2 style="font-size:29px;margin:9px 0">${state.authMode==='login'?'С возвращением!':'Создать аккаунт'}</h2><p class="sub">${state.authMode==='login'?'Войди, чтобы продолжить работу с проектами.':'Заполни данные, чтобы найти единомышленников.'}</p><div class="auth-tabs"><button class="${state.authMode==='login'?'active':''}" onclick="setAuthMode('login')">Вход</button><button class="${state.authMode==='register'?'active':''}" onclick="setAuthMode('register')">Регистрация</button></div><div id="authMessage"></div><form id="authForm">${state.authMode==='register'?`<div class="form-grid"><div class="field"><label>Имя</label><input name="firstName" required maxlength="50" placeholder="Иван"></div><div class="field"><label>Фамилия</label><input name="lastName" required maxlength="50" placeholder="Иванов"></div></div>`:''}<div class="field"><label>Электронная почта</label><input name="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>Пароль</label><input name="password" type="password" required minlength="4" placeholder="Введите пароль"></div>${state.authMode==='register'?`<div class="field"><label>Университет</label><select name="university" required>${universityOptions()}</select></div><div class="field"><label>Курс</label><select name="course">${[1,2,3,4,5,6].map(n=>`<option value="${n}">${n} курс</option>`).join('')}</select></div>`:''}<button type="submit" style="width:100%;margin-top:4px">${state.authMode==='login'?'Войти в аккаунт':'Зарегистрироваться'}</button></form><p class="muted" style="margin-top:18px">Продолжая, ты соглашаешься использовать платформу для учебных проектов.</p></section></div>`}
function setAuthMode(mode){state.authMode=mode;render();}
function universityOptions(){return `<option value="">Выберите университет</option>`+state.universities.map(u=>`<option value="${esc(enumName(universityEnums,u.id))}">${esc(u.title||u.name||u.id)}</option>`).join('')}
function shell(){return `<div class="layout"><aside class="sidebar"><div class="brand">Uni<span>Team</span></div><div class="nav"><button class="${state.view==='projects'||state.view==='project'?'active':''}" onclick="setView('projects')">▦ &nbsp; Проекты</button><button class="${state.view==='profile'?'active':''}" onclick="setView('profile')">◉ &nbsp; Мой профиль</button><button onclick="logout()">↪ &nbsp; Выйти</button></div><div class="sidebar-note">Находи людей. Создавай проекты. Делай больше вместе.</div></aside><main class="main"><header class="topbar"><div><strong>${state.view==='profile'?'Личный кабинет':state.view==='project'?'Карточка проекта':'Каталог проектов'}</strong><br><small>${state.view==='profile'?'Твои данные и навыки':state.view==='project'?'Состав команды и управление проектом':'Исследуй идеи и присоединяйся к командам'}</small></div><div class="row"><span class="muted">${esc(state.user?.firstName||'Студент')} ${esc(state.user?.lastName||'')}</span><div style="width:36px;height:36px;background:#e9edff;color:#3553b8;border-radius:50%;display:grid;place-items:center;font-weight:800">${esc((state.user?.firstName||'U').slice(0,1).toUpperCase())}</div></div></header><div class="content" id="page">${pageView()}</div></main></div>`}
function projectsView(){let list=state.projects.filter(p=>(!state.query||(p.title+' '+p.description+' '+(p.stack||[]).join(' ')).toLowerCase().includes(state.query.toLowerCase())));return `<div class="eyebrow">ОТ ИДЕИ ДО КОМАНДЫ</div><div class="row between" style="margin-bottom:7px;flex-wrap:wrap"><h1 class="heading">Найди свой следующий проект</h1><button onclick="openCreate()">＋ Создать проект</button></div><p class="sub">Выбирай интересное направление и работай вместе с другими студентами.</p><div class="stats"><div class="panel stat"><span class="muted">Доступно проектов</span><strong>${state.projects.length}</strong></div><div class="panel stat"><span class="muted">Направлений</span><strong>${new Set(state.projects.map(p=>p.theme).filter(Boolean)).size}</strong></div><div class="panel stat"><span class="muted">Твой курс</span><strong>${state.user?.course||'—'}</strong></div></div><div class="filters"><input placeholder="Поиск по названию, описанию, навыкам…" value="${esc(state.query)}" oninput="state.query=this.value;renderProjectsOnly()"><select id="filterUniversity" onchange="state.filterUniversity=this.value;loadProjects()"><option value="">Все университеты</option>${state.universities.map(u=>`<option value="${esc(enumName(universityEnums,u.id))}" ${state.filterUniversity===enumName(universityEnums,u.id)?'selected':''}>${esc(u.title||u.name||u.id)}</option>`).join('')}</select><select id="filterCourse" onchange="state.filterCourse=this.value;loadProjects()"><option value="">Любой курс</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${state.filterCourse==n?'selected':''}>От ${n} курса</option>`).join('')}</select><button class="secondary" onclick="state.query='';state.filterUniversity='';state.filterCourse='';loadProjects()">Сбросить</button></div><div id="projectList" class="projects">${projectCards(list)}</div>`}
function projectCards(list){if(!list.length)return `<div class="panel empty"><div style="font-size:30px;margin-bottom:10px">⌕</div><strong>Пока ничего не найдено</strong><p>Попробуй изменить фильтры или создай свой проект.</p></div>`;return list.map(p=>`<article class="project"><div class="row between"><span class="pill">${esc(typeTitles[p.theme]||p.theme||'Проект')}</span><span class="muted">${p.stars??0} ★</span></div><h3 class="link" onclick="openProject(${Number(p.id)})">${esc(p.title||'Без названия')}</h3><p>${esc(p.description||'Описание не добавлено')}</p><div class="muted">⌂ ${esc(uniTitle(p.university)||'Университет не указан')} · От ${esc(p.minCourse??1)} курса</div><div class="tags">${(p.stack||[]).slice(0,7).map(s=>`<span class="tag">${esc(skillTitle(s))}</span>`).join('')||'<span class="tag">Навыки не указаны</span>'}</div><div class="project-foot"><span class="muted">ID проекта: ${esc(p.id)}</span><button class="secondary" onclick="openProject(${Number(p.id)})">Открыть →</button></div></article>`).join('')}
function renderProjectsOnly(){const el=$('#projectList');if(!el)return;const q=state.query.toLowerCase();const filtered=state.projects.filter(p=>!q||(String(p.title||'')+' '+String(p.description||'')+' '+(p.stack||[]).join(' ')).toLowerCase().includes(q));el.innerHTML=projectCards(filtered)}
function profileView(){const u=state.user||{};return `<div class="eyebrow">ТВОЙ ПРОФИЛЬ</div><h1 class="heading">Привет, ${esc(u.firstName||'студент')}!</h1><p class="sub">Информация о тебе, которая помогает командам находить тебя.</p><div class="panel" style="margin-bottom:18px"><div class="row between" style="margin-bottom:18px"><h3 style="margin:0">Личные данные</h3><button class="ghost" onclick="loadProfile()">↻ Обновить</button></div><div class="profile-info"><div class="info-item"><small>Имя и фамилия</small><strong>${esc((u.firstName||'')+' '+(u.lastName||''))}</strong></div><div class="info-item"><small>Email</small><strong>${esc(u.email||'—')}</strong></div><div class="info-item"><small>Университет</small><strong>${esc(u.university?.title||u.university||'Не указан')}</strong></div><div class="info-item"><small>Курс</small><strong>${esc(u.course||'—')}</strong></div></div></div><div class="panel"><h3 style="margin-top:0">Мои навыки</h3><p class="muted">Отметь технологии, с которыми работаешь. Можно добавить до 10 навыков.</p><div class="field"><label>Добавить навык</label><div class="row"><select id="skillSelect"><option value="">Выбери технологию</option>${state.skills.map(s=>`<option value="${esc(enumName(skillEnums,s.id))}">${esc(s.title||s.name||s.id)}</option>`).join('')}</select><button onclick="addSkill()">Добавить</button></div></div><div class="tags" style="margin-top:15px">${(u.skills||[]).map(s=>`<span class="tag">${esc(s)} <button class="small-link" style="margin-left:5px" onclick="removeSkill('${esc(s)}')" title="Удалить">×</button></span>`).join('')||'<span class="muted">Пока навыки не добавлены</span>'}</div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><div class="row"><div style="flex:1"><label>Изменить курс</label><select id="courseSelect">${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${u.course==n?'selected':''}>${n} курс</option>`).join('')}</select></div><button onclick="updateCourse()" style="align-self:end">Сохранить курс</button></div></div>`}
function render(){const app=$('#app');app.innerHTML=state.access?shell():authScreen();if(!state.access){const form=$('#authForm');if(form)form.addEventListener('submit',submitAuth)}}
async function submitAuth(e){e.preventDefault();const f=new FormData(e.currentTarget);const email=f.get('email'),password=f.get('password');try{if(state.authMode==='register'){const body={firstName:f.get('firstName'),lastName:f.get('lastName'),email,password,university:f.get('university'),course:Number(f.get('course')),skills:[]};await api('/auth/register',{method:'POST',body:JSON.stringify(body)});toast('Аккаунт создан. Теперь войди в систему.');state.authMode='login';render();return}const tokens=await api('/auth/login',{method:'POST',body:JSON.stringify({email,password})});saveTokens(tokens.accessToken,tokens.refreshToken);await afterLogin()}catch(err){const m=$('#authMessage');if(m)m.innerHTML=`<div class="notice error">${esc(err.message)}</div>`}}
async function afterLogin(){try{await loadProfile();await loadProjects();state.view='projects';render();await restoreRoute()}catch(e){toast(e.message);if(!state.user){saveTokens('','');render()}}}
async function loadProfile(){state.user=await api('/users');if(state.view==='profile')render()}
async function loadProjects(){try{let q=[];if(state.filterUniversity)q.push('university='+encodeURIComponent(state.filterUniversity));if(state.filterCourse)q.push('course='+encodeURIComponent(state.filterCourse));const data=await api('/projects'+(q.length?'?'+q.join('&'):''));state.projects=data?.projects||[];if(state.access&&state.view==='projects')render()}catch(e){toast(e.message)}}
function setView(view){state.view=view;if(location.hash)history.replaceState(null,'',location.pathname);if(view==='profile')loadProfile().catch(e=>toast(e.message));else loadProjects();render()}
async function joinProject(id){try{const r=await api('/users/join_project/'+id,{method:'POST'});toast(r?.message||'Заявка обработана');await loadProfile();await loadProjects()}catch(e){toast(e.message)}}
async function addSkill(){const s=$('#skillSelect')?.value;if(!s)return toast('Сначала выбери навык');try{state.user=await api('/users/add_skill/'+encodeURIComponent(s),{method:'POST'});render();toast('Навык добавлен')}catch(e){toast(e.message)}}
async function removeSkill(s){try{state.user=await api('/users/delete_skill/'+encodeURIComponent(s),{method:'DELETE'});render();toast('Навык удалён')}catch(e){toast(e.message)}}
async function updateCourse(){const c=$('#courseSelect')?.value;try{state.user=await api('/users/set_course/'+c,{method:'POST'});render();toast('Курс обновлён')}catch(e){toast(e.message)}}
function openCreate(){const types=state.types.map(t=>`<option value="${esc(t.name||t.type||t.id)}">${esc(typeTitles[t.type]||t.title||t.name||t.id)}</option>`).join('');const skills=state.skills.map(s=>`<label class="check"><input type="checkbox" name="stack" value="${esc(enumName(skillEnums,s.id))}"> ${esc(s.title||s.name||s.id)}</label>`).join('');const modal=document.createElement('div');modal.className='modal-backdrop';modal.id='createModal';modal.innerHTML=`<div class="modal"><div class="row between"><h2>Новый проект</h2><button class="ghost" onclick="closeCreate()">✕</button></div><p class="sub">Опиши идею — другие студенты смогут найти проект в каталоге.</p><div id="createError"></div><form id="createForm"><div class="field"><label>Название</label><input name="title" required maxlength="100" placeholder="Например, сервис для студентов"></div><div class="field"><label>Описание</label><textarea name="description" required placeholder="Что будем создавать и зачем?"></textarea></div><div class="form-grid"><div class="field"><label>Направление</label><select name="projectType" required>${types}</select></div><div class="field"><label>Минимальный курс</label><select name="minCourse">${[1,2,3,4,5,6].map(n=>`<option value="${n}">${n} курс</option>`).join('')}</select></div></div><div class="field"><label>Технологии (необязательно)</label><div class="checkbox-grid">${skills}</div></div><div class="row" style="justify-content:flex-end;margin-top:18px"><button type="button" class="ghost" onclick="closeCreate()">Отмена</button><button type="submit">Создать проект</button></div></form></div>`;document.body.appendChild(modal);$('#createForm').addEventListener('submit',createProject)}
function closeCreate(){document.querySelector('#createModal')?.remove()}
async function createProject(e){e.preventDefault();const f=new FormData(e.currentTarget);const body={title:f.get('title'),description:f.get('description'),projectType:f.get('projectType'),stack:f.getAll('stack'),minCourse:Number(f.get('minCourse'))};try{await api('/projects',{method:'POST',body:JSON.stringify(body)});closeCreate();toast('Проект успешно создан');await loadProjects()}catch(err){const el=$('#createError');if(el)el.innerHTML=`<div class="notice error">${esc(err.message)}</div>`}}
async function logout(){try{await api('/auth/logout',{method:'POST'})}catch(e){}saveTokens('','');state.user=null;state.projects=[];state.view='projects';render()}
/* ===== Карточка проекта ===== */
const roleTitles={CAPTAIN:'Капитан',SUBCAPTAIN:'Заместитель',EMPLOYEE:'Участник'};
const skillTitle=n=>state.skills.find(s=>enumName(skillEnums,s.id)===n)?.title||n;
const uniTitle=n=>state.universities.find(u=>enumName(universityEnums,u.id)===n)?.title||n||'';
const appliedKey=()=>'unit_applied_'+(state.user?.id||'');
const getApplied=()=>{try{return JSON.parse(localStorage.getItem(appliedKey())||'[]')}catch{return[]}};
const setApplied=a=>localStorage.setItem(appliedKey(),JSON.stringify(a));
const toastByAction={add:'Заявка принята',cancel:'Заявка отклонена',appoint_as_deputy:'Назначен заместителем',demote_position:'Понижен до участника'};

/* Что видит и может текущий пользователь в открытом проекте (зеркало правил ProjectService на бэкенде) */
function myRole(){return state.members.find(m=>m.userId===state.user?.id)?.userRole||null}
function perms(){
  const role=myRole(),cap=role==='CAPTAIN',sub=role==='SUBCAPTAIN';
  return{role,canEdit:cap||sub,canReview:cap||sub,canPromote:cap,canJoin:!role,canLeave:!!role,
    canRemove:t=>cap?(t==='EMPLOYEE'||t==='SUBCAPTAIN'):sub?t==='EMPLOYEE':false}
}
function pageView(){return state.view==='projects'?projectsView():state.view==='project'?projectDetailView():profileView()}

async function openProject(id){
  state.view='project';state.projectId=id;state.project=null;state.members=[];state.candidates=[];state.cancelled=[];
  history.replaceState(null,'','#project/'+id);render();await refreshProject();
}
async function refreshProject(){
  const id=state.projectId;
  try{
    const [p,m]=await Promise.all([api('/projects/'+id),api('/projects/'+id+'/members')]);
    if(state.projectId!==id)return;
    state.project=p;state.members=m?.members||[];
    if(perms().canReview){ // списки заявок бэкенд отдаёт только капитану и заместителю
      const [c,x]=await Promise.all([api('/projects/'+id+'/candidates'),api('/projects/'+id+'/cancelled_candidates')]);
      state.candidates=c?.users||[];state.cancelled=x?.users||[];
    }else{state.candidates=[];state.cancelled=[]}
  }catch(e){toast(e.message);if(!state.project)return backToProjects()}
  if(state.view==='project')render();
}
function backToProjects(){setView('projects')}
async function restoreRoute(){const m=location.hash.match(/^#project\/(\d+)$/);if(m)await openProject(Number(m[1]))}

function memberRow(m){
  const pm=perms(),me=m.userId===state.user?.id,r=m.userRole,acts=[];
  if(!me){
    if(pm.canPromote&&r==='EMPLOYEE')acts.push(`<button class="secondary sm" onclick="memberAction('appoint_as_deputy',${m.userId})">Сделать заместителем</button>`);
    if(pm.canPromote&&r==='SUBCAPTAIN')acts.push(`<button class="secondary sm" onclick="memberAction('demote_position',${m.userId})">Понизить до участника</button>`);
    if(pm.canRemove(r))acts.push(`<button class="danger sm" onclick="removeMember(${m.userId})">Удалить</button>`);
  }
  return `<div class="member"><div class="avatar">${esc((m.userEmail||'?').slice(0,1).toUpperCase())}</div><div class="grow"><strong>${esc(m.userEmail)}</strong>${me?' <span class="muted">(вы)</span>':''}</div><span class="badge ${esc(r)}">${esc(roleTitles[r]||r)}</span>${acts.length?`<div class="row">${acts.join('')}</div>`:''}</div>`;
}
function candidateRow(u){
  return `<div class="member"><div class="avatar">${esc((u.firstName||'?').slice(0,1).toUpperCase())}</div><div class="grow"><strong>${esc(u.firstName)} ${esc(u.lastName)}</strong><div class="muted">${esc(u.email)} · ${esc(u.course)} курс · ${esc(uniTitle(u.university))}</div><div class="tags" style="margin-top:6px">${(u.skills||[]).map(s=>`<span class="tag">${esc(skillTitle(s))}</span>`).join('')}</div></div><div class="row"><button class="sm" onclick="memberAction('add',${u.id})">Принять</button><button class="danger sm" onclick="memberAction('cancel',${u.id})">Отклонить</button></div></div>`;
}
function projectDetailView(){
  const p=state.project;
  const back=`<button class="ghost sm" onclick="backToProjects()" style="margin-bottom:16px">← Все проекты</button>`;
  if(!p)return back+`<div class="panel empty">Загрузка проекта…</div>`;
  const pm=perms(),applied=getApplied().includes(p.id),acts=[];
  if(pm.canEdit)acts.push(`<button onclick="openEdit()">✎ Редактировать</button>`);
  if(pm.canJoin)acts.push(applied?`<button class="secondary" disabled>Заявка отправлена</button>`:`<button onclick="joinCurrent()">Присоединиться →</button>`);
  if(pm.canLeave)acts.push(`<button class="ghost" onclick="leaveCurrent()">Покинуть проект</button>`);
  const review=pm.canReview?`<div class="panel" style="margin-top:18px"><h3 style="margin-top:0">Заявки на вступление <span class="muted">(${state.candidates.length})</span></h3>${state.candidates.map(candidateRow).join('')||'<p class="muted">Новых заявок нет.</p>'}${state.cancelled.length?`<details style="margin-top:14px"><summary class="muted" style="cursor:pointer">Отклонённые заявки (${state.cancelled.length})</summary>${state.cancelled.map(u=>`<div class="member"><div class="avatar">${esc((u.firstName||'?').slice(0,1).toUpperCase())}</div><div class="grow">${esc(u.firstName)} ${esc(u.lastName)} <span class="muted">· ${esc(u.email)}</span></div></div>`).join('')}</details>`:''}</div>`:'';
  return back+`<div class="panel"><div class="row between" style="flex-wrap:wrap;align-items:flex-start"><div><div class="row" style="margin-bottom:8px"><span class="pill">${esc(typeTitles[p.theme]||p.theme||'Проект')}</span>${pm.role?`<span class="badge ${esc(pm.role)}">${esc(roleTitles[pm.role]||pm.role)}</span>`:''}</div><h1 class="heading" style="margin:0">${esc(p.title)}</h1></div><div class="row" style="flex-wrap:wrap">${acts.join('')}</div></div><p style="line-height:1.6;white-space:pre-wrap;color:#46516a">${esc(p.description||'Описание не добавлено')}</p><div class="profile-info"><div class="info-item"><small>Университет</small><strong>${esc(uniTitle(p.university)||'—')}</strong></div><div class="info-item"><small>Минимальный курс</small><strong>${esc(p.minCourse)}</strong></div></div><div style="margin-top:16px"><small class="muted">Стек технологий</small><div class="tags" style="margin-top:6px">${(p.stack||[]).map(s=>`<span class="tag">${esc(skillTitle(s))}</span>`).join('')||'<span class="muted">Не указан</span>'}</div></div></div><div class="panel" style="margin-top:18px"><h3 style="margin-top:0">Участники <span class="muted">(${state.members.length})</span></h3>${state.members.map(memberRow).join('')||'<p class="muted">Участников пока нет.</p>'}</div>${review}`;
}

async function memberAction(act,uid){
  try{await api(`/projects/${state.projectId}/${act}/${uid}`,{method:'POST'});toast(toastByAction[act]||'Готово');await refreshProject()}catch(e){toast(e.message)}
}
async function removeMember(uid){
  const m=state.members.find(x=>x.userId===uid);
  if(!confirm(`Удалить ${m?.userEmail||'участника'} из проекта?`))return;
  try{await api(`/projects/${state.projectId}/${uid}`,{method:'DELETE'});toast('Участник удалён');await refreshProject()}catch(e){toast(e.message)}
}
async function joinCurrent(){
  try{const r=await api('/users/join_project/'+state.projectId,{method:'POST'});setApplied([...new Set([...getApplied(),state.projectId])]);toast(r?.message||'Заявка отправлена');await loadProfile().catch(()=>{});await refreshProject()}catch(e){toast(e.message)}
}
async function leaveCurrent(){
  const warn=myRole()==='CAPTAIN'?'Вы капитан: роль перейдёт заместителю или другому участнику, а если вы последний — проект будет удалён. Покинуть проект?':'Покинуть проект?';
  if(!confirm(warn))return;
  try{await api('/users/leave_project/'+state.projectId,{method:'DELETE'});setApplied(getApplied().filter(i=>i!==state.projectId));await loadProfile().catch(()=>{});toast('Вы покинули проект');backToProjects()}catch(e){toast(e.message)}
}
function openEdit(){
  const p=state.project;
  const skills=state.skills.map(s=>{const n=enumName(skillEnums,s.id);return `<label class="check"><input type="checkbox" name="stack" value="${esc(n)}" ${(p.stack||[]).includes(n)?'checked':''}> ${esc(s.title)}</label>`}).join('');
  const modal=document.createElement('div');modal.className='modal-backdrop';modal.id='editModal';
  modal.innerHTML=`<div class="modal"><div class="row between"><h2>Редактирование проекта</h2><button class="ghost" onclick="closeEdit()">✕</button></div><div id="editError"></div><form id="editForm"><div class="field"><label>Название</label><input name="title" required maxlength="100" value="${esc(p.title)}"></div><div class="field"><label>Описание</label><textarea name="description" required>${esc(p.description)}</textarea></div><div class="form-grid"><div class="field"><label>Направление</label><input value="${esc(typeTitles[p.theme]||p.theme)}" disabled></div><div class="field"><label>Минимальный курс</label><input value="${esc(p.minCourse)}" disabled></div></div><div class="field"><label>Технологии</label><div class="checkbox-grid">${skills}</div></div><div class="row" style="justify-content:flex-end;margin-top:18px"><button type="button" class="ghost" onclick="closeEdit()">Отмена</button><button type="submit">Сохранить</button></div></form></div>`;
  document.body.appendChild(modal);$('#editForm').addEventListener('submit',saveProject);
}
function closeEdit(){document.querySelector('#editModal')?.remove()}
async function saveProject(e){
  e.preventDefault();const f=new FormData(e.currentTarget),p=state.project;
  const body={title:f.get('title'),description:f.get('description'),projectType:p.theme,minCourse:p.minCourse,stack:f.getAll('stack')};
  try{await api(`/projects/${p.id}/common_info`,{method:'PUT',body:JSON.stringify(body)});closeEdit();toast('Проект обновлён');await refreshProject()}
  catch(err){const el=$('#editError');if(el)el.innerHTML=`<div class="notice error">${esc(err.message)}</div>`}
}
(async function init(){state.access=localStorage.getItem('unit_access')||'';state.refresh=localStorage.getItem('unit_refresh')||'';await loadCommon();if(state.access){try{await afterLogin()}catch(e){saveTokens('','');render()}}else render()})();
</script></body></html>
